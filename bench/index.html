<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="bench-token" content="__TOKEN__">
<title>工作台</title>
<style>
:root{
  /* 旧粉 */
  --bg:#F1E6E3; --panel:#F9F2EF; --paper:#FCF8F5;
  --ink:#4A3A3E; --muted:#9A8689; --line:#E2D0CE;
  --accent:#C0868E; --accent-deep:#8E5C66; --accent-ink:#fff;
  --tag:#FAF1EE; --tag-edge:#D8B6BA; --rope:#BA8C93; --rope2:#DCC0C2;
  --gold:#C8B27C; --hover:#F0E2DF;
  --c-kw:#A25A6E; --c-str:#76896A; --c-com:#B5A2A4; --c-num:#B87A4C; --c-pre:#8C7298;
  --mono:ui-monospace,"Cascadia Mono","Consolas","SFMono-Regular",Menlo,monospace;
  --serif:"Songti SC","SimSun","Noto Serif CJK SC","Source Han Serif SC",serif;
  --script:"Palace Script MT","Edwardian Script ITC","Segoe Script","Snell Roundhand","Brush Script MT",cursive;
  --ease-drop:cubic-bezier(.3,1.35,.5,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;overflow:hidden;position:relative;
}
/* 纸张颗粒 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .42  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- 挂牌侧边栏 ---------- */
.rail{
  width:92px;flex:none;position:relative;z-index:5;
  background:linear-gradient(180deg,var(--panel),#F5EAE7);
  transition:width .55s cubic-bezier(.5,0,.2,1);
}
.rail::after{ /* 右侧波浪纸边 */
  content:"";position:absolute;top:0;bottom:0;right:-9px;width:9px;pointer-events:none;
  background:radial-gradient(circle at 0 50%,var(--panel) 5.5px,transparent 6px) 0 0/9px 14px repeat-y;
  filter:drop-shadow(1px 0 0 var(--line));
}
.rail.up{width:60px}

.knob{
  position:relative;z-index:3;display:block;margin:12px auto 0;width:46px;height:42px;border:0;background:none;
  color:var(--accent);transition:transform .3s;
}
.knob svg{width:100%;height:100%;fill:currentColor;stroke:var(--accent-deep);stroke-width:.9;stroke-linejoin:round;overflow:visible}
.knob:hover{transform:rotate(-6deg) scale(1.06)}
.rail.up .knob{transform:rotate(180deg) scale(.9)}
.rail.up .knob:hover{transform:rotate(174deg) scale(.95)}

.rope{
  position:absolute;left:50%;top:44px;bottom:16px;width:3px;margin-left:-1.5px;border-radius:2px;
  background:repeating-linear-gradient(135deg,var(--rope) 0 2px,var(--rope2) 2px 4px);
  transform-origin:top;transition:transform .55s cubic-bezier(.5,0,.2,1) .1s;
}
.rail.up .rope{transform:scaleY(0);transition-delay:.25s}

.tags{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 20px}
.tag{
  border:0;background:none;padding:0;position:relative;display:flex;flex-direction:column;align-items:center;
  width:64px;transform-origin:50% 0;
}
.tag .cord{width:2px;height:10px;background:var(--rope)}
.card{
  position:relative;width:60px;height:78px;border-radius:14px 14px 9px 9px;
  background:var(--tag);border:1.5px solid var(--tag-edge);color:var(--accent-deep);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;padding-bottom:9px;
  box-shadow:0 3px 8px rgba(120,70,80,.16);transform-origin:50% -10px;
}
.card::before{ /* 吊孔 */
  content:"";position:absolute;top:7px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--tag-edge);box-shadow:inset 0 1px 1px rgba(0,0,0,.12);
}
.card::after{ /* 内侧虚线 */
  content:"";position:absolute;inset:4px;border:1px dashed rgba(192,134,142,.45);border-radius:10px 10px 6px 6px;pointer-events:none;
}
.card svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:18px}
.card b{font:600 11px/1 var(--serif);letter-spacing:.12em;padding-left:.12em}
.tag.on .card{background:var(--accent);border-color:var(--accent-deep);color:var(--accent-ink)}
.tag.on .card::before{background:var(--panel)}
.tag.on .card::after{border-color:rgba(255,255,255,.5)}
.tag[disabled]{cursor:default}
.tag[disabled] .card{background:#F4EAE7;color:#C6AEB1;border-style:dashed;box-shadow:none}
.tag:not([disabled]):not(.on):hover .card{background:#fff;animation:sway .9s ease-in-out}

/* 放下 */
.rail:not(.up) .tag{animation:drop .75s var(--ease-drop) both;animation-delay:calc(var(--i) * 75ms + .15s)}
.rail:not(.up) .card{animation:swing 1.9s ease-out both;animation-delay:calc(var(--i) * 75ms + .55s)}
/* 收起：从最下面一张开始，一张张被绳子拉上去 */
.rail.up .tag{animation:reel .5s cubic-bezier(.6,0,.9,.6) both;animation-delay:calc((5 - var(--i)) * 55ms)}
.rail.up .tag{pointer-events:none}
@keyframes drop{
  0%{transform:translateY(-140%) scaleY(.6);opacity:0}
  35%{opacity:1}
  65%{transform:translateY(7px) scaleY(1.04);opacity:1}
  100%{transform:none;opacity:1}
}
@keyframes reel{
  0%{transform:none;opacity:1}
  100%{transform:translateY(-150%) scaleY(.5);opacity:0;visibility:hidden}
}
@keyframes swing{
  0%{transform:rotate(0)}15%{transform:rotate(6deg)}35%{transform:rotate(-4deg)}
  55%{transform:rotate(2.4deg)}75%{transform:rotate(-1.2deg)}100%{transform:rotate(0)}
}
@keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(4deg)}70%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){
  .rail,.rope,.knob{transition:none}
  .rail:not(.up) .tag,.rail:not(.up) .card,.rail.up .tag,.tag:hover .card{animation:none!important}
  .rail.up .tag{visibility:hidden}
}

/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:9px}
.top{
  height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.top::after{ /* 波浪花边 */
  content:"";position:absolute;left:0;right:0;top:100%;height:9px;pointer-events:none;z-index:2;
  background:radial-gradient(circle at 50% 0,var(--panel) 5.5px,transparent 6px) 0 0/14px 9px repeat-x;
  filter:drop-shadow(0 1px 0 var(--line));
}
.top .t{font:600 19px/1 var(--serif);letter-spacing:.2em}
.top .sub{font:20px/1 var(--script);color:var(--accent);margin-top:2px}
.sp{flex:1}
.btn{border:1px solid var(--accent-deep);border-radius:9px;padding:6px 15px;background:var(--accent);color:var(--accent-ink);transition:transform .15s,background .15s}
.btn:hover{background:var(--accent-deep);transform:translateY(-1px)}
.btn:disabled{opacity:.6;transform:none}
.btn.ghost{background:var(--paper);color:var(--accent-deep);border-color:var(--tag-edge)}
.btn.ghost:hover{background:#fff}
.view{flex:1;min-height:0;display:none;margin-top:9px}
.view.on{display:flex}

#v-chat iframe{flex:1;border:0;width:100%;background:var(--bg)}

#v-code{flex-direction:column}
.editor{flex:1;min-height:0;display:flex;background:var(--paper);margin:0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(120,70,80,.08)}
.gut{flex:none;width:48px;padding:12px 8px 12px 0;text-align:right;color:var(--c-com);font:13px/20px var(--mono);overflow:hidden;user-select:none;border-right:1px solid var(--line);white-space:pre;background:var(--panel)}
.ed{position:relative;flex:1;min-width:0}
.ed pre,.ed textarea{
  position:absolute;inset:0;margin:0;padding:12px 14px;border:0;
  font:13px/20px var(--mono);tab-size:4;white-space:pre;overflow:auto;letter-spacing:0;
}
.ed pre{pointer-events:none;color:var(--ink);background:transparent}
.ed textarea{background:transparent;color:transparent;caret-color:var(--accent-deep);resize:none;outline:none}
.ed textarea::selection{background:rgba(192,134,142,.3);color:transparent}
.k{color:var(--c-kw)}.s{color:var(--c-str)}.c{color:var(--c-com);font-style:italic}.n{color:var(--c-num)}.p{color:var(--c-pre)}
.out{flex:none;height:32%;min-height:110px;margin:12px 14px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:flex;overflow:hidden}
.out .col{display:flex;flex-direction:column;min-width:0;flex:1}
.out .col.in{flex:none;width:30%;border-right:1px dashed var(--tag-edge)}
.out h4{margin:0;padding:8px 14px 4px;font:600 12px/1.4 var(--serif);color:var(--muted);letter-spacing:.08em}
.out pre,.out textarea{margin:0;padding:4px 14px 12px;font:13px/1.6 var(--mono);overflow:auto;flex:1;white-space:pre-wrap;border:0;background:transparent;color:var(--ink);outline:none;resize:none}
.out .err{color:#B0483A}
.out .dim{color:var(--muted)}
</style>
</head>
<body>

<aside class="rail" id="rail">
  <button class="knob" id="tog" aria-label="收起或放下挂牌" title="收起 / 放下">
    <svg viewBox="0 0 32 32"><path d="M16 16C10 8 3 9 3 15s7 7 13 1zM16 16c6-8 13-7 13-1s-7 7-13 1z"/><circle cx="16" cy="16" r="2.4"/><path d="M14 18l-3 9M18 18l3 9" fill="none"/></svg>
  </button>
  <div class="rope"></div>
  <nav class="tags" id="nav">
    <button class="tag on" data-v="chat" style="--i:0" title="聊天"><span class="cord"></span><span class="card">
      <svg viewBox="0 0 28 28"><path d="M5 7a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-7l-5 4v-4H8a3 3 0 0 1-3-3z"/><path d="M10 10h8M10 13.5h5"/></svg><b>聊天</b></span></button>
    <button class="tag" data-v="code" style="--i:1" title="代码"><span class="cord"></span><span class="card">
      <svg viewBox="0 0 28 28"><path d="M10 9l-5 5 5 5M18 9l5 5-5 5M16 7l-4 14"/></svg><b>代码</b></span></button>
    <button class="tag" disabled style="--i:2" title="终端（待做）"><span class="cord"></span><span class="card">
      <svg viewBox="0 0 28 28"><rect x="3" y="5" width="22" height="18" rx="3"/><path d="M8 12l4 3-4 3M15 19h5"/></svg><b>终端</b></span></button>
    <button class="tag" disabled style="--i:3" title="文件（待做）"><span class="cord"></span><span class="card">
      <svg viewBox="0 0 28 28"><path d="M3 9a2 2 0 0 1 2-2h6l3 3h9a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><b>文件</b></span></button>
    <button class="tag" disabled style="--i:4" title="课表（待做）"><span class="cord"></span><span class="card">
      <svg viewBox="0 0 28 28"><rect x="4" y="6" width="20" height="18" rx="3"/><path d="M4 12h20M10 4v4M18 4v4M9 17h2M13 17h2M17 17h2"/></svg><b>课表</b></span></button>
    <button class="tag" disabled style="--i:5" title="笔记（待做）"><span class="cord"></span><span class="card">
      <svg viewBox="0 0 28 28"><rect x="7" y="3" width="17" height="22" rx="2"/><path d="M11 9h9M11 13h9M11 17h5M7 7H4M7 12H4M7 17H4"/></svg><b>笔记</b></span></button>
  </nav>
</aside>

<div class="main">
  <header class="top">
    <span class="t" id="title">聊天</span>
    <span class="sub">mon petit atelier</span>
    <span class="sp"></span>
    <span id="codeBtns" hidden>
      <button class="btn ghost" id="sample">示例</button>
      <button class="btn" id="run" title="快捷键 F5">▶ 运行</button>
    </span>
  </header>

  <section class="view on" id="v-chat"><iframe title="聊天"></iframe></section>

  <section class="view" id="v-code">
    <div class="editor">
      <div class="gut" id="gut">1</div>
      <div class="ed">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea>
      </div>
    </div>
    <div class="out">
      <div class="col in"><h4>输入（程序要读的数据，没有就留空）</h4><textarea id="stdin" spellcheck="false"></textarea></div>
      <div class="col"><h4>输出</h4><pre id="outp">点"运行"后，结果显示在这里。</pre></div>
    </div>
  </section>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};

/* ---------- 挂牌：切换页面 / 绳子收放 ---------- */
var titles={chat:'聊天',code:'代码'};
function show(v){
  ['chat','code'].forEach(function(k){$('v-'+k).classList.toggle('on',k===v)});
  [].forEach.call($('nav').querySelectorAll('.tag[data-v]'),function(b){b.classList.toggle('on',b.dataset.v===v)});
  $('title').textContent=titles[v];
  $('codeBtns').hidden=(v!=='code');
  if(v==='code')$('ta').focus();
  try{localStorage.setItem('bench.view',v)}catch(e){}
}
$('nav').addEventListener('click',function(e){var b=e.target.closest('.tag[data-v]');if(b)show(b.dataset.v)});
$('tog').addEventListener('click',function(){
  var up=$('rail').classList.toggle('up');
  try{localStorage.setItem('bench.up',up?'1':'')}catch(e){}
});
try{if(localStorage.getItem('bench.up'))$('rail').classList.add('up')}catch(e){}

/* ---------- 代码编辑器 ---------- */
var ta=$('ta'),hl=$('hl'),gut=$('gut');
var KW='auto break case char const continue default do double else enum extern float for goto if inline int long register return short signed sizeof static struct switch typedef union unsigned void volatile while';
var KWSET={};KW.split(' ').forEach(function(w){KWSET[w]=1});
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function highlight(src){
  var re=/(\/\*[\s\S]*?(?:\*\/|$)|\/\/[^\n]*)|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(^[ \t]*#[^\n]*)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/gm;
  var out='',last=0,m;
  while((m=re.exec(src))){
    out+=esc(src.slice(last,m.index));
    if(m[1])out+='<span class="c">'+esc(m[1])+'</span>';
    else if(m[2])out+='<span class="s">'+esc(m[2])+'</span>';
    else if(m[3])out+='<span class="p">'+esc(m[3])+'</span>';
    else if(m[4])out+='<span class="n">'+esc(m[4])+'</span>';
    else if(KWSET[m[5]])out+='<span class="k">'+esc(m[5])+'</span>';
    else out+=esc(m[5]);
    last=re.lastIndex;
    if(m[0]==='')re.lastIndex++;
  }
  return out+esc(src.slice(last));
}
function refresh(){
  var v=ta.value;
  hl.innerHTML=highlight(v)+'\n';
  var n=v.split('\n').length,g='';
  for(var i=1;i<=n;i++)g+=i+(i<n?'\n':'');
  gut.textContent=g;
  syncScroll();
  try{localStorage.setItem('bench.code',v)}catch(e){}
}
function syncScroll(){hl.scrollTop=ta.scrollTop;hl.scrollLeft=ta.scrollLeft;gut.scrollTop=ta.scrollTop}
ta.addEventListener('scroll',syncScroll);
ta.addEventListener('input',refresh);

function ins(text){
  ta.focus();
  var ok=false;
  try{ok=document.execCommand('insertText',false,text)}catch(e){}
  if(!ok){ta.setRangeText(text,ta.selectionStart,ta.selectionEnd,'end');refresh()}
}
function lineStart(pos){return ta.value.lastIndexOf('\n',pos-1)+1}
var PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'"};
var CLOSERS={')':1,']':1,'}':1,'"':1,"'":1};

ta.addEventListener('keydown',function(e){
  if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;
  var v=ta.value,s=ta.selectionStart,t=ta.selectionEnd,k=e.key;

  if(k==='Enter'){
    e.preventDefault();
    var ls=lineStart(s),line=v.slice(ls,s),indent=(line.match(/^[ \t]*/)||[''])[0];
    var before=v.charAt(s-1),after=v.charAt(t);
    if(before==='{'&&after==='}'){
      ins('\n'+indent+'    '+'\n'+indent);
      var p=s+1+indent.length+4;ta.setSelectionRange(p,p);
    }else if(before==='{'){
      ins('\n'+indent+'    ');
    }else{
      ins('\n'+indent);
    }
    return;
  }
  if(k==='Tab'){
    e.preventDefault();
    if(s===t&&!e.shiftKey){ins('    ');return}
    var a=lineStart(s),b=t,blk=v.slice(a,b),lines=blk.split('\n'),res;
    if(e.shiftKey)res=lines.map(function(l){return l.replace(/^( {1,4}|\t)/,'')});
    else res=lines.map(function(l){return '    '+l});
    ta.setSelectionRange(a,b);ins(res.join('\n'));
    ta.setSelectionRange(a,a+res.join('\n').length);
    return;
  }
  if(k==='Backspace'&&s===t&&s>0){
    var l=v.charAt(s-1),r=v.charAt(s);
    if(PAIRS[l]&&PAIRS[l]===r){
      e.preventDefault();ta.setSelectionRange(s-1,s+1);ins('');return;
    }
    var ls2=lineStart(s),pre=v.slice(ls2,s);
    if(pre.length>=4&&/^ +$/.test(pre)&&pre.length%4===0){
      e.preventDefault();ta.setSelectionRange(s-4,s);ins('');return;
    }
    return;
  }
  if(CLOSERS[k]&&s===t&&v.charAt(s)===k){
    e.preventDefault();ta.setSelectionRange(s+1,s+1);return;
  }
  if(PAIRS[k]){
    var prev=v.charAt(s-1);
    if((k==='"'||k==="'")&&/\w/.test(prev))return;
    e.preventDefault();
    if(s!==t){ins(k+v.slice(s,t)+PAIRS[k]);ta.setSelectionRange(s+1,t+1);return}
    ins(k+PAIRS[k]);ta.setSelectionRange(s+1,s+1);return;
  }
  if(k==='}'&&s===t){
    var ls3=lineStart(s),pre3=v.slice(ls3,s);
    if(/^ +$/.test(pre3)&&pre3.length>=4){
      e.preventDefault();ta.setSelectionRange(s-4,s);ins('}');return;
    }
  }
});

var SAMPLE='#include <stdio.h>\n\nint main(void) {\n    int n = 5, sum = 0;\n    for (int i = 1; i <= n; i++) {\n        sum += i;\n    }\n    printf("1 到 %d 的和是 %d\\n", n, sum);\n    return 0;\n}\n';
$('sample').addEventListener('click',function(){
  ta.value=SAMPLE;refresh();ta.focus();
});
var saved='';try{saved=localStorage.getItem('bench.code')||''}catch(e){}
ta.value=saved||SAMPLE;refresh();

/* 运行：把代码交给电脑上的启动器去编译、运行 */
function setOut(text,cls){var o=$('outp');o.className=cls||'';o.textContent=text}
var runBtn=$('run');
function run(){
  var m=document.querySelector('meta[name=bench-token]');
  var tok=m?m.content:'';
  if(!tok||tok.indexOf('__TOK')===0){
    setOut('这个页面没有连上编译器。\n请在电脑上双击 start.bat，用它自动打开的页面来运行。','dim');return;
  }
  if(runBtn.disabled)return;
  runBtn.disabled=true;runBtn.textContent='运行中…';setOut('编译中…','dim');
  fetch('/run',{method:'POST',headers:{'Content-Type':'application/json','X-Token':tok},
    body:JSON.stringify({code:ta.value,stdin:$('stdin').value})})
  .then(function(r){return r.json()})
  .then(function(j){
    var o=$('outp');o.className='';o.textContent='';
    function add(t,c){var s=document.createElement('span');if(c)s.className=c;s.textContent=t;o.appendChild(s)}
    if(!j.compiled){add('编译失败：\n','err');add(j.compileLog||'');return}
    if(j.compileLog){add('[编译提示]\n'+j.compileLog+'\n','dim')}
    add(j.output||'');
    if(j.timedOut)add('\n[超过 5 秒，已强行停止]','err');
    else add('\n[程序结束，返回值 '+j.exit+']','dim');
  })
  .catch(function(){setOut('连不上启动器。它的黑窗口是不是被关了？重新双击 start.bat。','err')})
  .then(function(){runBtn.disabled=false;runBtn.textContent='▶ 运行'});
}
runBtn.addEventListener('click',run);
document.addEventListener('keydown',function(e){
  if(e.key==='F5'&&$('v-code').classList.contains('on')){e.preventDefault();run()}
});

/* 在本机地址打开时，聊天页要指向网上的那一份 */
(function(){
  var f=document.querySelector('#v-chat iframe');
  var local=(location.hostname==='127.0.0.1'||location.hostname==='localhost');
