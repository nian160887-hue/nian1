<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的窗口">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>我的窗口</title>
<style>
  /* 所有颜色、圆角、字号都在这几个变量里。右上角的"外观"面板改的就是它们。 */
  :root{
    --bg:#ffffff; --panel:#f6f6f6; --ink:#222222; --muted:#888888; --line:#e2e2e2;
    --me:#ececec; --me-ink:#222222; --ai:#ffffff;
    --accent:#222222; --accent-ink:#ffffff;
    --radius:14px; --fs:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font:var(--fs)/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    display:flex;overflow:hidden;
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  }
  button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* 左侧会话栏 */
  .side{
    width:270px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:10px;padding:14px;
    padding-top:calc(14px + env(safe-area-inset-top,0px));
  }
  .side h1{font-size:1.05em;font-weight:600;padding:4px 6px}
  .new{border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:10px;text-align:center}
  .new:hover{border-color:var(--muted)}
  .list{display:flex;flex-direction:column;gap:4px;overflow:auto;flex:1;min-height:0}
  .item{display:flex;align-items:center;gap:6px;border-radius:var(--radius);padding:8px 10px;cursor:pointer}
  .item:hover,.item.on{background:var(--me)}
  .item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92em;color:var(--ink)}
  .item .x{color:var(--muted);padding:0 6px;font-size:1.1em}
  .item .x:hover{color:var(--ink)}

  /* 主区 */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
  .top{
    display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);
    padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .top .ttl{flex:1;min-width:0;text-align:center;font-size:.95em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ibtn{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88em;background:var(--bg)}
  .ibtn:hover{border-color:var(--muted)}
  #menu{display:none}

  .chat{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
  .msg{max-width:min(78%,640px);padding:10px 14px;border-radius:var(--radius);white-space:pre-wrap;word-break:break-word;border:1px solid var(--line);animation:pop .28s ease both}
  .msg.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-color:transparent}
  .msg.ai{align-self:flex-start;background:var(--ai)}
  .dots{display:inline-flex;gap:4px;align-items:center;height:1.4em}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .note{align-self:center;color:var(--muted);font-size:.8em;text-align:center;padding:4px 10px}

  .bar{
    display:flex;gap:8px;align-items:flex-end;padding:10px 14px;border-top:1px solid var(--line);
    padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  }
  textarea{
    flex:1;min-width:0;resize:none;max-height:140px;font:inherit;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;line-height:1.5;
  }
  .send{background:var(--accent);color:var(--accent-ink);border-radius:var(--radius);padding:10px 18px;height:44px}
  .send:disabled{opacity:.4;cursor:default}

  /* 外观面板 */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:20}
  .sheet-bg.on{display:block}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;
    background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));
    transform:translateY(105%);transition:transform .28s ease;max-height:82vh;overflow:auto;
  }
  .sheet.on{transform:none}
  .sheet h2{font-size:1em;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
  .row{display:flex;align-items:center;gap:12px;margin:12px 0}
  .row label{width:4.5em;font-size:.9em;color:var(--muted);flex-shrink:0}
  .row input[type=range]{flex:1;accent-color:var(--accent)}
  .row input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
  .presets{display:flex;flex-wrap:wrap;gap:8px}
  .presets button{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88em;background:var(--bg)}
  .presets button.on{border-color:var(--accent);background:var(--me)}
  .hint{color:var(--muted);font-size:.8em;margin-top:8px}

  @media (max-width:760px){
    .side{position:fixed;inset:0 auto 0 0;z-index:15;transform:translateX(-102%);transition:transform .25s ease;width:min(80vw,300px)}
    .side.on{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.18)}
    #menu{display:inline-block}
    .msg{max-width:86%}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<aside class="side" id="side">
  <h1>我的窗口</h1>
  <button class="new" id="new" type="button">+ 新对话</button>
  <div class="list" id="list"></div>
</aside>

<section class="main">
  <div class="top">
    <button class="ibtn" id="menu" type="button" aria-label="打开会话列表">会话</button>
    <div class="ttl" id="ttl">新对话</div>
    <button class="ibtn" id="look" type="button">外观</button>
  </div>
  <div class="chat" id="chat" aria-live="polite"></div>
  <form class="bar" id="form">
    <textarea id="input" rows="1" placeholder="说点什么…" aria-label="输入消息"></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
</section>

<div class="sheet-bg" id="sbg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="外观设置">
  <h2><span>外观</span><button class="ibtn" id="close" type="button">完成</button></h2>
  <div class="presets" id="presets"></div>
  <div class="row"><label for="cAccent">主色</label><input type="color" id="cAccent"></div>
  <div class="row"><label for="cBg">背景色</label><input type="color" id="cBg"></div>
  <div class="row"><label for="rRadius">圆角</label><input type="range" id="rRadius" min="0" max="28" step="1"></div>
  <div class="row"><label for="rFont">字号</label><input type="range" id="rFont" min="14" max="20" step="1"></div>
  <p class="hint">先点一个预设，再微调颜色和圆角。改动会自动保存在这台手机上。</p>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};

/* ---------- 外观 ---------- */
var PRESETS={
  '素白':{bg:'#ffffff',panel:'#f6f6f6',ink:'#222222',muted:'#888888',line:'#e2e2e2',me:'#ececec',meInk:'#222222',ai:'#ffffff',accent:'#222222'},
  '奶油陶土':{bg:'#F0EEE6',panel:'#FAF9F5',ink:'#2B2A26',muted:'#6F6B5E',line:'#E3DFD2',me:'#F4E1D6',meInk:'#7A3418',ai:'#FAF9F5',accent:'#C15F3C'},
  '雾蓝':{bg:'#E8EEF7',panel:'#F5F8FC',ink:'#26324A',muted:'#6B7A96',line:'#D5DEEC',me:'#CFDCF1',meInk:'#26324A',ai:'#F8FAFD',accent:'#5B7DB1'},
  '樱粉':{bg:'#FBF1F3',panel:'#FFF8F9',ink:'#4A2B33',muted:'#9B7681',line:'#F0D9DE',me:'#F8D7DF',meInk:'#6A2F40',ai:'#FFF8F9',accent:'#D9758F'},
  '深夜':{bg:'#14161C',panel:'#1B1E26',ink:'#E8EAF0',muted:'#8C93A6',line:'#2A2E3A',me:'#2B3550',meInk:'#E8EAF0',ai:'#1B1E26',accent:'#8FB4FF'}
};
var theme={preset:'素白',vars:Object.assign({},PRESETS['素白']),radius:14,font:16};

function lum(hex){
  var n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b)/255;
}
function mix(a,b,t){
  var x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16),o=0;
  for(var s=16;s>=0;s-=8){var p=(x>>s)&255,q=(y>>s)&255;o=(o<<8)|Math.round(p+(q-p)*t);}
  return '#'+('000000'+o.toString(16)).slice(-6);
}
function applyTheme(){
  var v=theme.vars,r=document.documentElement.style;
  r.setProperty('--bg',v.bg);r.setProperty('--panel',v.panel);r.setProperty('--ink',v.ink);
  r.setProperty('--muted',v.muted);r.setProperty('--line',v.line);r.setProperty('--me',v.me);
  r.setProperty('--me-ink',v.meInk);r.setProperty('--ai',v.ai);r.setProperty('--accent',v.accent);
  r.setProperty('--accent-ink',lum(v.accent)>0.6?'#1b1b1b':'#ffffff');
  r.setProperty('--radius',theme.radius+'px');r.setProperty('--fs',theme.font+'px');
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',v.bg);
  $('cAccent').value=v.accent;$('cBg').value=v.bg;$('rRadius').value=theme.radius;$('rFont').value=theme.font;
  Array.prototype.forEach.call($('presets').children,function(b){b.classList.toggle('on',b.textContent===theme.preset);});
}
function saveTheme(){try{localStorage.setItem('mywin.theme',JSON.stringify(theme));}catch(e){}}
function loadTheme(){
  try{
    var s=JSON.parse(localStorage.getItem('mywin.theme')||'null');
    if(s&&s.vars&&s.vars.bg&&s.vars.accent){theme=s;}
  }catch(e){}
}
Object.keys(PRESETS).forEach(function(name){
  var b=document.createElement('button');b.type='button';b.textContent=name;
  b.addEventListener('click',function(){theme.preset=name;theme.vars=Object.assign({},PRESETS[name]);applyTheme();saveTheme();});
  $('presets').appendChild(b);
});
$('cAccent').addEventListener('input',function(e){
  theme.vars.accent=e.target.value;theme.preset='自定义';
  theme.vars.me=mix(theme.vars.bg,e.target.value,0.18);
  theme.vars.meInk=lum(theme.vars.me)>0.55?mix(theme.vars.ink,e.target.value,0.35):theme.vars.ink;
  applyTheme();saveTheme();
});
$('cBg').addEventListener('input',function(e){
  var bg=e.target.value,dark=lum(bg)<0.45;
  theme.vars.bg=bg;theme.preset='自定义';
  theme.vars.panel=mix(bg,dark?'#ffffff':'#ffffff',dark?0.05:0.55);
  theme.vars.ai=theme.vars.panel;
  theme.vars.line=mix(bg,dark?'#ffffff':'#000000',dark?0.14:0.09);
  theme.vars.ink=dark?'#e8eaf0':'#222222';theme.vars.muted=dark?'#8c93a6':'#777777';
  theme.vars.me=mix(bg,theme.vars.accent,0.18);theme.vars.meInk=theme.vars.ink;
  applyTheme();saveTheme();
});
$('rRadius').addEventListener('input',function(e){theme.radius=+e.target.value;applyTheme();saveTheme();});
$('rFont').addEventListener('input',function(e){theme.font=+e.target.value;applyTheme();saveTheme();});

function openSheet(on){$('sheet').classList.toggle('on',on);$('sbg').classList.toggle('on',on);}
$('look').addEventListener('click',function(){openSheet(true);});
$('close').addEventListener('click',function(){openSheet(false);});
$('sbg').addEventListener('click',function(){openSheet(false);});

/* ---------- 会话数据 ---------- */
var state={convs:[],cur:null};
function uid(){return 'c'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
function save(){try{localStorage.setItem('mywin.state',JSON.stringify(state));}catch(e){}}
function load(){
  try{var s=JSON.parse(localStorage.getItem('mywin.state')||'null');if(s&&Array.isArray(s.convs))state=s;}catch(e){}
}
function cur(){for(var i=0;i<state.convs.length;i++)if(state.convs[i].id===state.cur)return state.convs[i];return null;}
function newConv(){
  var c={id:uid(),title:'新对话',msgs:[{r:'ai',t:'你好，这是你自己的窗口。\n现在回复都是演示用的，还没接上真正的 AI。先在右上角"外观"里把它调成你喜欢的样子。'}]};
  state.convs.unshift(c);state.cur=c.id;save();renderAll();
}

/* ---------- 渲染 ---------- */
var chatEl=$('chat');
function bubble(m){
  var d=document.createElement('div');d.className='msg '+m.r;d.textContent=m.t;return d;
}
function renderList(){
  var l=$('list');l.textContent='';
  state.convs.forEach(function(c){
    var it=document.createElement('div');it.className='item'+(c.id===state.cur?' on':'');
    var t=document.createElement('span');t.className='t';t.textContent=c.title;
    var x=document.createElement('button');x.className='x';x.type='button';x.textContent='×';x.setAttribute('aria-label','删除这段对话');
    x.addEventListener('click',function(e){
      e.stopPropagation();
      state.convs=state.convs.filter(function(q){return q.id!==c.id;});
      if(state.cur===c.id)state.cur=state.convs.length?state.convs[0].id:null;
      if(!state.convs.length){newConv();return;}
      save();renderAll();
    });
    it.addEventListener('click',function(){state.cur=c.id;save();renderAll();$('side').classList.remove('on');});
    it.appendChild(t);it.appendChild(x);l.appendChild(it);
  });
}
function renderChat(){
  var c=cur();chatEl.textContent='';
  if(!c)return;
  $('ttl').textContent=c.title;
  c.msgs.forEach(function(m){chatEl.appendChild(bubble(m));});
  chatEl.scrollTop=chatEl.scrollHeight;
}
function renderAll(){renderList();renderChat();}

/* ---------- 假回复（以后这里换成真的 AI） ---------- */
var LINES=[
  '收到啦。这是演示回复，等接上真的 AI，这里就会是它的话。',
  '我现在只是个会打字的壳子，但你看，气泡、动画、颜色都是你自己的。',
  '想换个感觉的话，点右上角的"外观"，试试不同的预设。',
  '你说的我记下了。下一步可以让它长出新功能，比如发图片、换头像。'
];
var busy=false;
function reply(userText){
  var c=cur();if(!c)return;
  busy=true;$('send').disabled=true;
  var m={r:'ai',t:''};c.msgs.push(m);
  var d=bubble(m);var dots=document.createElement('span');dots.className='dots';
  dots.innerHTML='<i></i><i></i><i></i>';d.appendChild(dots);chatEl.appendChild(d);chatEl.scrollTop=chatEl.scrollHeight;
  var short=userText.length>40?userText.slice(0,40)+'…':userText;
  var full='你说：「'+short+'」\n'+LINES[(userText.length+c.msgs.length)%LINES.length];
  setTimeout(function(){
    d.textContent='';var i=0;
    (function tick(){
      i+=1;m.t=full.slice(0,i);d.textContent=m.t;chatEl.scrollTop=chatEl.scrollHeight;
      if(i<full.length){setTimeout(tick,28);}else{busy=false;$('send').disabled=!$('input').value.trim();save();}
    })();
  },650);
}

/* ---------- 输入 ---------- */
var input=$('input');
function grow(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';}
input.addEventListener('input',function(){grow();$('send').disabled=busy||!input.value.trim();});
var fine=window.matchMedia&&window.matchMedia('(pointer:fine)').matches;
input.addEventListener('keydown',function(e){
  if(fine&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit();}
});
$('form').addEventListener('submit',function(e){
  e.preventDefault();
  var t=input.value.trim();if(!t||busy)return;
  var c=cur();if(!c)return;
  c.msgs.push({r:'me',t:t});
  if(c.title==='新对话'){c.title=t.length>16?t.slice(0,16)+'…':t;}
  input.value='';grow();$('send').disabled=true;
  renderList();$('ttl').textContent=c.title;
  chatEl.appendChild(bubble({r:'me',t:t}));chatEl.scrollTop=chatEl.scrollHeight;
  save();reply(t);
});
$('new').addEventListener('click',function(){newConv();$('side').classList.remove('on');});
$('menu').addEventListener('click',function(){$('side').classList.toggle('on');});
chatEl.addEventListener('click',function(){$('side').classList.remove('on');});

/* ---------- 启动 ---------- */
loadTheme();applyTheme();load();
if(!state.convs.length||!cur()){state.convs=state.convs||[];newConv();}else{renderAll();}
$('send').disabled=true;
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
